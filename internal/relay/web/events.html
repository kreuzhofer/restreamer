<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event archive · Restreamer</title><link rel="stylesheet" href="/watch-assets/event.css"><link rel="stylesheet" href="/events.css"><script src="/events.js" defer></script></head>
<body><main>
<nav aria-label="Workspace"><a href="/live">Live</a><a href="/settings">Settings</a><a href="/events" aria-current="page">Event archive</a></nav>
<header><h1>Event archive</h1><p>One event, one link. Keep recordings private or make them available as replays.</p><a href="/settings">Create an event in Destinations</a></header>
<div class="archive-toolbar"><p id="archive-status" role="status" aria-live="polite">Loading events…</p><button id="archive-refresh" type="button">Refresh archive</button></div>
<div id="archive-list"></div>
<dialog id="archive-dialog"><form id="archive-form"><h2 id="archive-dialog-title"></h2><p id="archive-dialog-description"></p><label id="archive-password-label" for="archive-password" hidden>New event password (leave empty to remove protection)</label><input id="archive-password" type="password" autocomplete="new-password" maxlength="256" hidden><p id="archive-error" role="alert"></p><div class="playback-actions"><button id="archive-confirm" type="submit">Confirm</button><button id="archive-cancel" type="button">Cancel</button></div></form></dialog>
</main></body></html>
