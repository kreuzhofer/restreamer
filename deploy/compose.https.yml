services:
  restreamer:
    pull_policy: missing
  caddy:
    image: caddy:2
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RESTREAMER_DOMAIN: ${RESTREAMER_DOMAIN:?Set the dashboard domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      restreamer:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
