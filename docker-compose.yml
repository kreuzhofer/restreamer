services:
  restreamer:
    image: ${RESTREAMER_IMAGE:-ghcr.io/kreuzhofer/restreamer:main}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${RTMP_BIND_ADDRESS:-0.0.0.0}:1935:1935"
      - "${STATUS_BIND_ADDRESS:-127.0.0.1}:${STATUS_PORT:-8080}:8080"
    environment:
      # Optional one-time legacy migration; remove after the managed key is stored.
      INGESTION_SERVER_URL: ${INGESTION_SERVER_URL:-}
      INGEST_STREAM_KEY: ${INGEST_STREAM_KEY:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TARGET_STATE_FILE: /data/targets.json
      BRB_DIRECTORY: /data/brb
      LIBRARY_DIRECTORY: /data/videos
      EVENTS_DIRECTORY: /events
    volumes:
      - restreamer-state:/data
      - ${EVENT_STORAGE_PATH:-restreamer-events}:/events
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  restreamer-state:
  restreamer-events:
