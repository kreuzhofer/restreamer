services:
  restreamer:
    image: ${RESTREAMER_IMAGE:-ghcr.io/kreuzhofer/restreamer:main}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${RTMP_BIND_ADDRESS:-0.0.0.0}:1935:1935"
      - "${STATUS_BIND_ADDRESS:-127.0.0.1}:${STATUS_PORT:-8080}:8080"
    environment:
      INGEST_STREAM_KEY: ${INGEST_STREAM_KEY:?Set INGEST_STREAM_KEY in .env}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TARGET_STATE_FILE: /data/targets.json
      BRB_ENABLED: "${BRB_ENABLED:-false}"
      BRB_DIRECTORY: /data/brb
      LIBRARY_DIRECTORY: /data/videos
      TWITCH_ENABLED: "${TWITCH_ENABLED:-true}"
      TWITCH_SERVER: ${TWITCH_SERVER:-rtmp://live.twitch.tv/app}
      TWITCH_STREAM_KEY: ${TWITCH_STREAM_KEY:-}
      YOUTUBE_ENABLED: "${YOUTUBE_ENABLED:-true}"
      YOUTUBE_SERVER: ${YOUTUBE_SERVER:-rtmps://a.rtmps.youtube.com/live2}
      YOUTUBE_STREAM_KEY: ${YOUTUBE_STREAM_KEY:-}
    volumes:
      - restreamer-state:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  restreamer-state:
