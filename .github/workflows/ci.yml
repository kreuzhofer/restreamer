name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
        env:
          REQUIRE_FFMPEG_TESTS: '1'
      - run: go vet ./...
      - run: make cross-build
      - run: |
          INGEST_STREAM_KEY=ci-test-key-123456 docker compose config --quiet
          INGEST_STREAM_KEY=ci-test-key-123456 TWITCH_SERVER=rtmp://localhost/app TWITCH_STREAM_KEY=test YOUTUBE_STREAM_KEY=test docker compose config --quiet
          INGEST_STREAM_KEY=ci-test-key-123456 TWITCH_SERVER=rtmp://localhost/app TWITCH_STREAM_KEY=test YOUTUBE_STREAM_KEY=test docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - run: docker build -t restreamer:test .
      - name: Smoke test container, dashboard, and persistent controls
        shell: bash
        run: |
          env_args=(-e INGEST_STREAM_KEY=ci-test-key-123456 -e TWITCH_SERVER=rtmp://localhost/app -e TWITCH_STREAM_KEY=test -e YOUTUBE_SERVER=rtmps://localhost/live2 -e YOUTUBE_STREAM_KEY=test)
          docker run --rm -e INGEST_STREAM_KEY=ci-test-key-123456 restreamer:test -config /etc/restreamer/config.json -check-config
          docker run --rm "${env_args[@]}" restreamer:test -config /etc/restreamer/config.json -check-config
          docker volume create restreamer-smoke-state
          trap 'docker logs restreamer-smoke; docker rm -f restreamer-smoke; docker volume rm restreamer-smoke-state' EXIT
          start_container() {
            docker run -d --name restreamer-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              -p 127.0.0.1:18080:8080 -v restreamer-smoke-state:/data \
              -e TARGET_STATE_FILE=/data/targets.json -e BRB_ENABLED=true -e BRB_DIRECTORY=/data/brb -e DASHBOARD_USERNAME=ci -e DASHBOARD_PASSWORD=ci-dashboard-password \
              "${env_args[@]}" restreamer:test
            # Startup prepares BRB media before opening HTTP, including after a
            # restart. Docker can reset connections while the port is not ready.
            for attempt in {1..60}; do
              if docker exec restreamer-smoke /restreamer healthcheck; then
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' restreamer-smoke)" != true ]; then
                echo "Container exited before becoming healthy" >&2
                return 1
              fi
              sleep 1
            done
            echo "Container did not become healthy within the startup deadline" >&2
            return 1
          }
          start_container
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/dashboard)" = 401
          curl --fail -s -u ci:ci-dashboard-password http://127.0.0.1:18080/ > /dev/null
          curl --fail -s -u ci:ci-dashboard-password http://127.0.0.1:18080/status | jq -e '.forwarding == false'
          curl --fail -s -u ci:ci-dashboard-password -X PUT http://127.0.0.1:18080/api/forwarding \
            -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data '{"enabled":true}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u ci:ci-dashboard-password -X PUT http://127.0.0.1:18080/api/forwarding -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data '{"enabled":false}')" = 409
          curl --fail -s -u ci:ci-dashboard-password -X PUT http://127.0.0.1:18080/api/brb -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data '{"enabled":true}'
          curl --fail -s -u ci:ci-dashboard-password http://127.0.0.1:18080/status | jq -e '.brb.ready == true and .brb.manual == true'
          curl --fail -s -u ci:ci-dashboard-password -X PUT http://127.0.0.1:18080/api/forwarding -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data '{"enabled":false,"confirmed":true}'
          curl --fail -s -u ci:ci-dashboard-password -X PUT http://127.0.0.1:18080/api/targets/twitch \
            -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data '{"enabled":false}'
          docker rm -f restreamer-smoke
          start_container
          curl --fail --show-error -s -u ci:ci-dashboard-password \
            http://127.0.0.1:18080/status | jq -e '.forwarding == false and .brb.ready == true and .brb.manual == false and ([.outputs[] | select(.name == "twitch") | .enabled == false] | all)'
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures and publish main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
