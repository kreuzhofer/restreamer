name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: make check-brb-artwork
      - run: make check-web
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
        env:
          REQUIRE_FFMPEG_TESTS: '1'
      - run: go vet ./...
      - run: make cross-build
      - run: |
          INGEST_STREAM_KEY=ci-test-key-123456 docker compose config --quiet
          INGEST_STREAM_KEY=ci-test-key-123456 TWITCH_SERVER=rtmp://localhost/app TWITCH_STREAM_KEY=test YOUTUBE_STREAM_KEY=test docker compose config --quiet
          INGEST_STREAM_KEY=ci-test-key-123456 TWITCH_SERVER=rtmp://localhost/app TWITCH_STREAM_KEY=test YOUTUBE_STREAM_KEY=test docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - run: docker build -t restreamer:test .
      - name: Smoke test container, dashboard, and persistent controls
        shell: bash
        run: |
          env_args=(-e INGEST_STREAM_KEY=ci-test-key-123456 -e TWITCH_SERVER=rtmp://localhost/app -e TWITCH_STREAM_KEY=test -e YOUTUBE_SERVER=rtmps://localhost/live2 -e YOUTUBE_STREAM_KEY=test)
          docker run --rm -e INGEST_STREAM_KEY=ci-test-key-123456 restreamer:test -config /etc/restreamer/config.json -check-config
          docker run --rm "${env_args[@]}" restreamer:test -config /etc/restreamer/config.json -check-config
          docker volume create restreamer-smoke-state
          trap 'docker logs restreamer-smoke; docker rm -f restreamer-smoke; docker volume rm restreamer-smoke-state' EXIT
          start_container() {
            docker run -d --name restreamer-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              -p 127.0.0.1:18080:8080 -v restreamer-smoke-state:/data \
              -e TARGET_STATE_FILE=/data/targets.json -e BRB_ENABLED=true -e BRB_DIRECTORY=/data/brb -e DASHBOARD_USERNAME=ci -e DASHBOARD_PASSWORD=ci-dashboard-password \
              "${env_args[@]}" restreamer:test
            # Startup prepares BRB media before opening HTTP, including after a
            # restart. Docker can reset connections while the port is not ready.
            for attempt in {1..60}; do
              if docker exec restreamer-smoke /restreamer healthcheck; then
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' restreamer-smoke)" != true ]; then
                echo "Container exited before becoming healthy" >&2
                return 1
              fi
              sleep 1
            done
            echo "Container did not become healthy within the startup deadline" >&2
            return 1
          }
          start_container
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/dashboard)" = 401
          curl --fail -s -u ci:ci-dashboard-password http://127.0.0.1:18080/ > /dev/null
          api() {
            curl --fail --show-error -s -u ci:ci-dashboard-password "$@"
          }
          stage_status() {
            api http://127.0.0.1:18080/api/stage > /tmp/stage-status.json
          }
          command_serial=0
          stage_command() {
            local action="$1" options='{}'
            if [ "$#" -gt 1 ]; then options="$2"; fi
            command_serial=$((command_serial + 1))
            stage_status
            jq -n --slurpfile stage /tmp/stage-status.json --arg action "$action" \
              --arg id "ci-$command_serial" --argjson options "$options" \
              '{id:$id,server_id:$stage[0].server_id,context:$stage[0].context,action:$action,confirmed:true} + $options' > /tmp/stage-command.json
            api -X POST http://127.0.0.1:18080/api/stage/commands \
              -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' \
              --data-binary @/tmp/stage-command.json | jq -e '.state == "completed" or .state == "pending"'
          }
          wait_stage() {
            local expected="$1"
            for attempt in {1..30}; do
              stage_status
              if jq -e --arg expected "$expected" '.stage == $expected' /tmp/stage-status.json; then return 0; fi
              sleep 1
            done
            cat /tmp/stage-status.json
            return 1
          }
          stage_status
          jq -e '.stage == "OFF" and .mode == "off" and .pending == null' /tmp/stage-status.json
          api http://127.0.0.1:18080/status | jq -e '.forwarding == false and .brb.ready == true'
          # Exercise the generator with the packaged FFmpeg and embedded fonts,
          # then play its exact retained revision through isolated rehearsal.
          export GENERATOR_URL=http://127.0.0.1:18080 GENERATOR_USER=ci GENERATOR_PASSWORD=ci-dashboard-password
          export GENERATOR_SMOKE_OUTPUT=/tmp/generated-smoke.mp4 GENERATOR_SMOKE_STATE=/tmp/generated-smoke.json
          export GENERATOR_SMOKE_SOURCE=/tmp/generator-source.mp4
          docker exec restreamer-smoke ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=25 \
            -f lavfi -i sine=frequency=880:sample_rate=48000 -t 1.6 -c:v libx264 -threads 2 \
            -pix_fmt yuv420p -c:a aac -ac 2 -movflags frag_keyframe+empty_moov -f mp4 pipe:1 > "$GENERATOR_SMOKE_SOURCE"
          python3 tests/generator-smoke.py
          ffmpeg -v error -xerror -i /tmp/generated-smoke.mp4 -f null -
          ffmpeg -v error -xerror -i /tmp/generated-smoke-video.mp4 -f null -
          ffmpeg -v error -xerror -i /tmp/generated-smoke-brb.mp4 -f null -
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of json /tmp/generated-smoke-video.mp4 > /tmp/generated-smoke-video.json
          python3 tests/generator-smoke.py --verify-video /tmp/generated-smoke-video.json
          ffmpeg -v error -i /tmp/generated-smoke-video.mp4 -map 0:a:0 -ac 1 -f s16le /tmp/generated-smoke-audio.pcm
          python3 tests/generator-smoke.py --verify-audio /tmp/generated-smoke-audio.pcm
          ffmpeg -v error -xerror -i /tmp/generated-smoke-ending.mp4 -vf scale=16:16 -vsync 0 -pix_fmt rgb24 -f rawvideo /tmp/generated-smoke-ending.rgb
          ffmpeg -v error -i /tmp/generated-smoke-ending.mp4 -map 0:a:0 -ac 1 -f s16le /tmp/generated-smoke-ending.pcm
          python3 tests/generator-smoke.py --verify-ending /tmp/generated-smoke-ending
          # A real prepared MP4 drives the normal sequence in isolated rehearsal.
          # No platform connection is possible: delivery stays blocked and the
          # dummy destination URLs also point only to the container's localhost.
          ffmpeg -y -v error -f lavfi -i testsrc2=size=320x180:rate=25 -t 4 -c:v libx264 -threads 2 /tmp/library-smoke.mp4
          api -H 'X-Restreamer-Control: 1' \
            -F 'file=@/tmp/library-smoke.mp4' http://127.0.0.1:18080/api/library/upload
          wait_library() {
            for attempt in {1..90}; do
              api http://127.0.0.1:18080/api/library > /tmp/library-status.json
              if jq -e '(.files | length) == 1 and .files[0].state == "ready" and (.files[0].revision | length) == 64' /tmp/library-status.json; then return 0; fi
              if jq -e 'any(.files[]; .state == "failed")' /tmp/library-status.json; then cat /tmp/library-status.json; return 1; fi
              sleep 1
            done
            cat /tmp/library-status.json
            return 1
          }
          wait_library
          revision=$(jq -r '.files[0].revision' /tmp/library-status.json)
          jq -n --arg revision "$revision" \
            '{prestream:$revision,ending:$revision,shortcuts:[{name:"Smoke clip",revision:$revision}]}' > /tmp/stage-media.json
          api -X PUT http://127.0.0.1:18080/api/stage-media \
            -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' --data-binary @/tmp/stage-media.json
          api "http://127.0.0.1:18080/api/library/revisions/$revision/preview" > /tmp/candidate-preview.mp4
          ffmpeg -v error -xerror -i /tmp/candidate-preview.mp4 -f null -
          stage_command prestream "$(jq -nc --arg revision "$revision" '{mode:"preview_only",revision:$revision}')"
          stage_status
          jq -e '.stage == "PRESTREAM" and .mode == "preview_only" and .source == "file"' /tmp/stage-status.json
          # Capture the actual broadcast feed. A stage change closes it cleanly
          # at an MP4 fragment boundary, without a timeout-truncated media file.
          api http://127.0.0.1:18080/api/broadcast-preview > /tmp/broadcast-preview.mp4 &
          preview_pid=$!
          for attempt in {1..30}; do
            if [ "$(wc -c < /tmp/broadcast-preview.mp4)" -gt 4096 ]; then break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then wait "$preview_pid"; echo "Preview closed before receiving media" >&2; exit 1; fi
            sleep 1
          done
          test "$(wc -c < /tmp/broadcast-preview.mp4)" -gt 4096
          stage_command brb
          wait "$preview_pid"
          ffmpeg -v error -xerror -i /tmp/broadcast-preview.mp4 -f null -
          stage_command return
          stage_command play_clip "$(jq -nc --arg revision "$revision" '{revision:$revision}')"
          stage_command pause
          stage_command seek '{"position":1}'
          stage_command resume
          stage_command stop_clip
          stage_status
          jq -e '.stage == "PRESTREAM" and .mode == "preview_only"' /tmp/stage-status.json
          # Repeated identical command IDs reconcile outcomes instead of applying
          # the transition again. No client stays connected while ending runs.
          stage_command end_stream "$(jq -nc --arg revision "$revision" '{revision:$revision}')"
          api -X POST http://127.0.0.1:18080/api/stage/commands \
            -H 'Content-Type: application/json' -H 'X-Restreamer-Control: 1' \
            --data-binary @/tmp/stage-command.json | jq -e '.state == "completed" or .state == "pending"'
          wait_stage OFF
          api http://127.0.0.1:18080/status | jq -e '.forwarding == false and all(.outputs[]; .attempts == 0)'
          stage_command set_target '{"target":"twitch","enabled":false}'
          cp /tmp/stage-command.json /tmp/before-restart-command.json
          docker rm -f restreamer-smoke
          start_container
          python3 tests/generator-smoke.py --verify-restart
          wait_library
          api http://127.0.0.1:18080/api/stage-media > /tmp/restarted-stage-media.json
          jq -e --arg revision "$revision" '.prestream == $revision and .ending == $revision and .shortcuts == [{name:"Smoke clip",revision:$revision}]' /tmp/restarted-stage-media.json
          stage_status
          jq -e '.stage == "OFF" and .mode == "off" and .pending == null' /tmp/stage-status.json
          api http://127.0.0.1:18080/status | jq -e '.forwarding == false and .playback.state == "idle" and .brb.ready == true and all(.outputs[]; .attempts == 0) and ([.outputs[] | select(.name == "twitch") | .enabled == false] | all)'
          test "$(curl -s -o /tmp/restarted-command-result.json -w '%{http_code}' -u ci:ci-dashboard-password \
            -X POST http://127.0.0.1:18080/api/stage/commands -H 'Content-Type: application/json' \
            -H 'X-Restreamer-Control: 1' --data-binary @/tmp/before-restart-command.json)" = 409
          jq -e '.state == "rejected"' /tmp/restarted-command-result.json

  generator-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t restreamer:arm64-test .
      - name: Generate and preview media in the native ARM64 container
        shell: bash
        run: |
          docker volume create restreamer-arm64-state
          trap 'docker logs restreamer-arm64-smoke; docker rm -f restreamer-arm64-smoke; docker volume rm restreamer-arm64-state' EXIT
          start_container() {
            docker run -d --name restreamer-arm64-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              -p 127.0.0.1:18080:8080 -v restreamer-arm64-state:/data \
              -e INGEST_STREAM_KEY=ci-test-key-123456 -e TARGET_STATE_FILE=/data/targets.json \
              -e BRB_ENABLED=true -e BRB_DIRECTORY=/data/brb \
              -e DASHBOARD_USERNAME=ci -e DASHBOARD_PASSWORD=ci-dashboard-password \
              -e TWITCH_SERVER=rtmp://localhost/app -e TWITCH_STREAM_KEY=test \
              -e YOUTUBE_SERVER=rtmps://localhost/live2 -e YOUTUBE_STREAM_KEY=test restreamer:arm64-test
            for attempt in {1..60}; do
              if docker exec restreamer-arm64-smoke /restreamer healthcheck; then return 0; fi
              if [ "$(docker inspect --format '{{.State.Running}}' restreamer-arm64-smoke)" != true ]; then
                echo "ARM64 container exited before becoming healthy" >&2
                return 1
              fi
              sleep 1
            done
            echo "ARM64 container did not become healthy within the startup deadline" >&2
            return 1
          }
          start_container
          export GENERATOR_URL=http://127.0.0.1:18080 GENERATOR_USER=ci GENERATOR_PASSWORD=ci-dashboard-password
          export GENERATOR_SMOKE_OUTPUT=/tmp/generated-smoke.mp4 GENERATOR_SMOKE_STATE=/tmp/generated-smoke.json
          export GENERATOR_SMOKE_SOURCE=/tmp/generator-source.mp4
          docker exec restreamer-arm64-smoke ffmpeg -v error -f lavfi -i testsrc2=size=320x180:rate=25 \
            -f lavfi -i sine=frequency=880:sample_rate=48000 -t 1.6 -c:v libx264 -threads 2 \
            -pix_fmt yuv420p -c:a aac -ac 2 -movflags frag_keyframe+empty_moov -f mp4 pipe:1 > "$GENERATOR_SMOKE_SOURCE"
          python3 tests/generator-smoke.py
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -xerror -i pipe:0 -f null - < /tmp/generated-smoke.mp4
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -xerror -i pipe:0 -f null - < /tmp/generated-smoke-video.mp4
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -xerror -i pipe:0 -f null - < /tmp/generated-smoke-brb.mp4
          docker exec -i restreamer-arm64-smoke ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of json -i pipe:0 < /tmp/generated-smoke-video.mp4 > /tmp/generated-smoke-video.json
          python3 tests/generator-smoke.py --verify-video /tmp/generated-smoke-video.json
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -i pipe:0 -map 0:a:0 -ac 1 -f s16le pipe:1 < /tmp/generated-smoke-video.mp4 > /tmp/generated-smoke-audio.pcm
          python3 tests/generator-smoke.py --verify-audio /tmp/generated-smoke-audio.pcm
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -xerror -i pipe:0 -vf scale=16:16 -vsync 0 -pix_fmt rgb24 -f rawvideo pipe:1 < /tmp/generated-smoke-ending.mp4 > /tmp/generated-smoke-ending.rgb
          docker exec -i restreamer-arm64-smoke ffmpeg -v error -i pipe:0 -map 0:a:0 -ac 1 -f s16le pipe:1 < /tmp/generated-smoke-ending.mp4 > /tmp/generated-smoke-ending.pcm
          python3 tests/generator-smoke.py --verify-ending /tmp/generated-smoke-ending
          docker rm -f restreamer-arm64-smoke
          start_container
          python3 tests/generator-smoke.py --verify-restart

  image:
    needs: [test, generator-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures and publish main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
